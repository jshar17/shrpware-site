# Deploys the site to Cloudflare Workers on every push to main.
#
# This replaces the OpenAI Sites publish step. The build is a plain Cloudflare
# Workers app: `vinext build` emits dist/server/wrangler.json with the worker
# entry and the dist/client assets directory, and no bindings at all (no D1,
# R2, KV, or Durable Objects), so nothing outside this repo is required.
#
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN  - a token with the "Edit Cloudflare Workers" template
#
# Tests run before deploy, so a broken page cannot reach production.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
